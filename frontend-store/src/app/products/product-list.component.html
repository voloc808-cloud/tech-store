<div class="page">

  <!-- HEADER -->
  <div class="header">
    <div class="header-left">
      <h2>🛍️ Shopee Style Store</h2>
      <div class="sub">Sản phẩm nổi bật hôm nay</div>
    </div>

    <div class="header-right">
      <button class="cartBtn" type="button" (click)="goCart()">
        🛒 Giỏ hàng
        <span *ngIf="cartCount > 0" class="cartBadge">{{ cartCount }}</span>
      </button>

      <ng-container *ngIf="!isLoggedIn">
        <button class="linkBtn" type="button" (click)="router.navigateByUrl('/login')">Đăng nhập</button>
        <button class="linkBtn" type="button" (click)="router.navigateByUrl('/register')">Đăng ký</button>
      </ng-container>

      <ng-container *ngIf="isLoggedIn">
        <div class="userName">👤 {{ username }}</div>
        <button class="linkBtn" type="button" (click)="logout()">Logout</button>
      </ng-container>
    </div>
  </div>

  <!-- LOADING -->
  <div *ngIf="loading" class="loading">
    Đang tải sản phẩm...
  </div>


  <!-- ERROR -->
  <div *ngIf="error" class="error">
    {{ error }}
  </div>

  <!-- PRODUCT GRID -->
  <div class="grid" *ngIf="!loading && products.length">

    <div class="product-card" *ngFor="let p of products">


      <!-- IMAGE -->
      <div class="img-box">
        <img [src]="p.image || '/assets/product-placeholder.png'" />

        <div class="badge" [class.out]="p.stock === 0">
          {{ p.stock === 0 ? 'Hết hàng' : 'Còn ' + p.stock }}
        </div>
      </div>

      <!-- INFO -->
      <div class="info">
        <div class="name">{{ p.name }}</div>

        <div class="price">
          ${{ p.price }}
        </div>

        <!-- ACTION -->
        <button class="btn" (click)="openDetail(p.id)">
          🛒 Xem chi tiết
        </button>

        <button class="btn" (click)="addToCart(p)" [disabled]="p.stock === 0">
          ➕ Thêm vào giỏ
        </button>
      </div>

    </div>

  </div>

</div>
